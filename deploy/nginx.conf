# Compono Playground on nginx. TLS (e.g. certbot) is left out.
server {
    listen 80;
    server_name play.compono.md;

    # The deployed release; deploy/sync.mjs switches the symlink.
    root /var/lib/compono-playground/current;

    gzip on;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml;

    # .wasm must be served as application/wasm; mime.types has it since
    # nginx 1.21.0.

    # Hashed file names and Compono builds named after their commit: their
    # content never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /compono/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /compono/versions.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
